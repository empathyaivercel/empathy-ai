<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMPATHY AI</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f7fb;
padding:30px;
}

.container{
max-width:800px;
margin:auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 0 15px rgba(0,0,0,.1);
}

h1{
color:#2563eb;
}

select,textarea{
width:100%;
padding:12px;
margin-top:8px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
}

button{
width:100%;
padding:15px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

.result{
margin-top:20px;
padding:20px;
background:#eef4ff;
border-radius:10px;
display:none;
}
</style>
</head>

<body>

<div class="container">

<h1>❤️ EMPATHY AI</h1>

<p>Prima di inviare, capisci come sarà ricevuto.</p>

<label>Destinatario</label>

<select id="target">
<option>Partner</option>
<option>Mamma</option>
<option>Papà</option>
<option>Capo</option>
<option>Amico</option>
</select>

<label>Messaggio</label>

<textarea id="message"
placeholder="Scrivi qui il tuo messaggio"></textarea>

<button onclick="analyzeMessage()">
Analizza
</button>

<div id="result" class="result">

<h3>Come verrà percepito</h3>
<p id="perception"></p>

<h3>Emozione trasmessa</h3>
<p id="emotion"></p>

<h3>Bisogno nascosto</h3>
<p id="need"></p>

<h3>Versione consigliata</h3>
<p id="suggestion"></p>

</div>

</div>

<script>

async function analyzeMessage() {

  const target =
    document.getElementById("target").value;

  const message =
    document.getElementById("message").value;

  document.getElementById("result").style.display = "block";

  document.getElementById("perception").innerHTML =
    "Analisi in corso...";

  try {

    const response = await fetch(
      "/api/analyze",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          target,
          message
        })
      }
    );

    const data = await response.json();

    const aiResult =
      JSON.parse(data.result);

    document.getElementById("perception").innerHTML =
      aiResult.perception;

    document.getElementById("emotion").innerHTML =
      aiResult.emotion;

    document.getElementById("need").innerHTML =
      aiResult.need;

    document.getElementById("suggestion").innerHTML =
      aiResult.suggestion;

  } catch (error) {

    document.getElementById("perception").innerHTML =
      "Errore durante l'analisi";

    console.error(error);

  }
}


</script>

</body>
</html>
