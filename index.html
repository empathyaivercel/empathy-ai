<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMPATHY AI</title>
</head>
<body>

<h1>EMPATHY AI</h1>

<p>Prima di inviare, capisci come sarà ricevuto.</p>

<input id="message" placeholder="Scrivi un messaggio">

<button onclick="analyzeMessage()">
Analizza
</button>

<p id="output"></p>

<script>
function analyzeMessage() {
const msg = document.getElementById("message").value;
document.getElementById("output").innerHTML =
"Hai scritto: " + msg;
}
</script>

</body>
</html>
